# Line 13 - freehire fork smoke test (GitHub Actions)
# Approved by VR 2026-11-03. Scope: prove the pinned fork's Compose stack
# boots and completes ONE bounded ingest cycle on a free runner.
# This does NOT prove VPS sizing (runner != VPS) and is NOT the bootstrap.
# Install as .github/workflows/smoke.yml on the fork, run manually.
name: line13-smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (PINNED commit - the audited state, not fork HEAD)
        uses: actions/checkout@v4
        with:
          ref: 05d018f75428b335ef805fe5d8a98fb81b078fc4

      - name: Show pin
        run: git rev-parse HEAD && git log -1 --format='%ci %s'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create .env for smoke (AI off, local secrets only)
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          grep -q '^JWT_SECRET=.\+' .env && echo "JWT_SECRET set"

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for API and search readiness
        run: |
          for i in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)
            meili=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7700/health || true)
            echo "attempt $i: api=$api meili=$meili"
            [ "$api" = "200" ] && [ "$meili" = "200" ] && exit 0
            sleep 3
          done
          echo "API/search did not become ready"
          docker compose ps
          echo "=== app logs ==="; docker compose logs app --tail=100
          echo "=== db logs ==="; docker compose logs db --tail=30
          exit 1

      - name: Initialise the search index
        env:
          DATABASE_URL: postgres://hire:hire@localhost:5432/hire?sslmode=disable
          MEILI_URL: http://localhost:7700
          MEILI_MASTER_KEY: dev-insecure-meili-key
        run: go run ./cmd/reindex

      - name: Seed three known Greenhouse boards
        env:
          DATABASE_URL: postgres://hire:hire@localhost:5432/hire?sslmode=disable
        run: |
          go run ./cmd/add-board --provider=greenhouse --board=stripe --company="Stripe" --apply
          go run ./cmd/add-board --provider=greenhouse --board=shopify --company="Shopify" --apply
          go run ./cmd/add-board --provider=greenhouse --board=gitlab --company="GitLab" --apply

      - name: One bounded ingest pass (greenhouse)
        env:
          DATABASE_URL: postgres://hire:hire@localhost:5432/hire?sslmode=disable
          INGEST_RUN_TIMEOUT_SECONDS: "900"
          INGEST_SWEEP_RESERVE_SECONDS: "60"
        run: timeout 1200 go run ./cmd/ingest greenhouse || echo "ingest exited non-zero or timed out - see counts below"

      - name: Report what landed
        if: always()
        env:
          DATABASE_URL: postgres://hire:hire@localhost:5432/hire?sslmode=disable
        run: |
          docker compose exec -T db psql -U hire -d hire -c "SELECT count(*) AS total_jobs FROM jobs;"
          docker compose exec -T db psql -U hire -d hire -c "SELECT count(*) AS open_jobs FROM jobs WHERE closed_at IS NULL;"
                docker compose exec -T db psql -U hire -d hire -c "SELECT DISTINCT unnest(countries) FROM jobs;"
          docker compose exec -T db psql -U hire -d hire -c "SELECT count(*) AS canada_jobs FROM jobs WHERE 'ca' = ANY(countries);"
          docker compose exec -T db psql -U hire -d hire -c "SELECT count(*) AS slice_jobs FROM jobs WHERE 'ca' = ANY(countries) AND is_tech;"
          docker compose exec -T db psql -U hire -d hire -c "SELECT title, cities, countries, work_mode, category FROM jobs WHERE 'ca' = ANY(countries) LIMIT 5;"

      - name: Resource snapshot (runner numbers - NOT VPS sizing proof)
        if: always()
        run: docker stats --no-stream || true

      - name: Save logs
        if: always()
        run: docker compose logs > compose-logs.txt 2>&1 || true

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: compose-logs.txt
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        run: docker compose down -v
